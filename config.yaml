# NeuroSeek-MoE Pipeline Configuration

# Pipeline Settings
pipeline:
  output_dir: "./data/arxiv"  # Local fallback directory
  max_papers: 50000  # Target number of papers
  skip_stages: []  # List of stages to skip: [collect, extract, curate, preprocess, tokenize]
  resume: true  # Resume from last completed step
  cleanup_intermediate: true  # Delete intermediate files after processing
  use_drive: true  # Use Google Drive if available (Colab) - saves directly to Drive for persistence
  drive_base: "/content/drive/MyDrive/neuroMOE_results"  # Google Drive base path (Colab)

# Step 1: ArXiv Paper Collection
collection:
  max_papers: 50000  # Target number of papers (for backward compatibility, also in pipeline section)
  rate_limit: 0.5  # Requests per second (2 requests/sec = 0.5 delay) - optimized for Colab speed
  retry_max: 5  # Maximum retry attempts with exponential backoff
  batch_size: 30  # Papers per batch (increased from 25 for faster collection, still RAM-safe)
  ram_target: 50.0  # Target RAM percentage to stay below (default: 50.0)
  
  # Optimized query execution (recommended for large collections)
  use_optimized_queries: true  # Set to true to use query optimization pipeline
  skip_diagnostic: false  # Skip diagnostic analysis (faster, if you already know queries)
  max_papers_per_query: 1000  # Maximum papers per sub-query (ArXiv pagination limit)
  rate_limit_delay: 2.0  # Delay between requests in seconds (for optimized execution)

# Step 2: PDF Text Extraction
extraction:
  workers: 2  # Number of workers (2 is Colab safe)
  rate_limit: 0.4  # Seconds between requests
  max_pages: 6
  max_chars: 12000

# Step 3: NeMo Curator Curation
nemo_curator:
  # New Pipeline API settings (recommended, FREE - no AWS needed)
  use_pipeline_api: true  # Use new NeMo Curator Pipeline API with FREE download_arxiv()
  raw_data_path: "./data/arxiv/arxiv_raw_data"  # Directory for raw ArXiv downloads
  raw_output_path: "./data/arxiv/arxiv_raw_output.jsonl"  # Raw output before filtering
  filter_query: "cs.LG OR cs.AI OR q-bio.NC"  # ArXiv search query (healthcare+ML)
  max_workers: 1  # Number of workers (1 is Colab safe, no rate limiting issues)
  max_papers: 40000  # Maximum total papers to download
  batch_size: 1000  # Process papers in batches (for memory efficiency)
  checkpoint_interval: 1000  # Save checkpoint every N papers (for resume capability)
  resume: true  # Resume from checkpoint if interrupted
  
  # Legacy settings (if use_pipeline_api: false)
  use_gpu: true  # Use GPU for deduplication (Linux only)
  skip_dedup: true  # Skip deduplication if memory-constrained
  min_relevance_score: 0.05  # Minimum domain relevance to keep paper (lowered from 0.5 for better coverage)
  
  # Quality filters
  quality_filters:
    word_count_min: 100
    word_count_max: 25000
    alphanumeric_ratio_min: 0.4
    language: "en"  # Keep English only
  
  # Deduplication
  deduplication:
    similarity_threshold: 0.95  # MinHash similarity threshold
    use_gpu: false  # Use GPU for MinHash (if available)

# Step 4: Healthcare-Specific Processing
preprocessing:
  workers: 4  # Number of parallel workers
  preserve_sections: true  # Extract section boundaries
  preserve_abbreviations: true  # Preserve scientific abbreviations
  max_chars: 12000

# Step 5: Tokenizer Training
tokenizer:
  vocab_size: 30000  # Optimized for healthcare domain + compatibility with pretrained models
  model_prefix: "healthcare_tokenizer"
  character_coverage: 0.9995
  model_type: "bpe"
  special_tokens:
    - "[DISEASE]"
    - "[PROTEIN]"
    - "[DRUG]"
    - "[GENE]"
  normalization_rule_name: "identity"  # Preserve case

# Step 6: Model Training
training:
  # Model configuration
  model_path: null  # Path to pretrained model (optional)
  vocab_size: 30000  # Match tokenizer vocab size for consistency
  embedding_dim: 768
  num_shared_experts: 2
  num_routed_experts: 8
  top_k: 2
  
  # Training hyperparameters
  batch_size: 6
  gradient_accumulation_steps: 4
  max_steps: 50000
  learning_rate: 5e-4
  warmup_steps: 2000
  weight_decay: 1e-5
  max_grad_norm: 1.0
  
  # Dataset configuration
  max_length: 512
  min_length: 64
  shuffle_buffer: 100
  num_workers: 4
  pin_memory: true
  
  # Domain-aware loss weighting
  domain_weights:
    neurodegeneration: 1.5
    neuroscience: 1.2
    medical_imaging: 1.0
    clinical: 1.0
    drug_discovery: 1.0
    general_ml_health: 1.0
  
  # MoE Routing & Specialization Parameters (AGGRESSIVE - for stronger domain specialization)
  # These parameters control how experts specialize on different domains
  # Updated to more aggressive values to encourage stronger expert differentiation
  load_balance_loss_weight: 0.5  # Increased from 0.3 - strongly encourage diverse expert usage
  noise_scale: 1.0  # Increased from 0.7 - maximum exploration during training
  z_loss_weight: 0.005  # Increased from 0.003 - stronger prevention of over-confident routing
  temperature_schedule: "linear"  # Temperature decay schedule
  temperature_start: 3.0  # Increased from 2.0 - even more exploration at start
  temperature_end: 0.3  # Decreased from 0.5 - more exploitation at end (stronger specialization)
  temperature_steps: 10000  # Increased from 5000 - slower decay, more exploration time
  
  # Checkpointing
  checkpoint_dir: "./checkpoints"  # Local by default; set to "/content/drive/MyDrive/neuroMOE_results/checkpoints" for Colab Drive persistence
  checkpoint_interval: 5000  # Steps between checkpoints
  keep_last_n_checkpoints: 2
  
  # Logging
  log_interval: 100  # Steps between log entries
  log_file: "./training_log.csv"

# Step 7: Evaluation
evaluation:
  test_split: 0.1  # Fraction of data for testing
  batch_size: 16
  output_dir: "./evaluations"
  compute_perplexity: true
  compute_domain_accuracy: true
  compute_mrr: true
  compute_section_accuracy: true
  mrr_k: 20  # MRR@K

# Step 8: Inference Export
inference:
  output_dir: "./inference"
  quantize_int8: false  # INT8 quantization
  export_onnx: false  # Export to ONNX
  precompute_embeddings: true  # Precompute corpus embeddings
  embedding_cache_size: 10000  # LRU cache size

