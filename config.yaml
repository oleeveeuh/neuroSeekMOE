# NeuroSeek-MoE Pipeline Configuration

# Pipeline Settings
pipeline:
  output_dir: "./data/arxiv"
  resume: true  # Resume from last completed step
  cleanup_intermediate: true  # Delete intermediate files after processing

# Step 1: ArXiv Paper Collection
collection:
  max_papers: 40000
  rate_limit: 3.0  # Requests per second
  cache_file: null  # Auto: output_dir/arxiv_papers.jsonl

# Step 2: PDF Text Extraction
extraction:
  num_workers: 4
  rate_limit_delay: 0.4  # Seconds between requests
  max_pages: 6
  max_chars: 12000

# Step 3: NeMo Curator Curation
nemo_curator:
  # New Pipeline API settings (recommended, FREE - no AWS needed)
  use_pipeline_api: true  # Use new NeMo Curator Pipeline API with FREE download_arxiv()
  raw_data_path: "./data/arxiv/arxiv_raw_data"  # Directory for raw ArXiv downloads
  raw_output_path: "./data/arxiv/arxiv_raw_output.jsonl"  # Raw output before filtering
  filter_query: "cs.LG OR cs.AI OR q-bio.NC"  # ArXiv search query (healthcare+ML)
  max_workers: 1  # Number of workers (1 is Colab safe, no rate limiting issues)
  
  # Legacy settings (if use_pipeline_api: false)
  use_gpu: false  # Use GPU for deduplication (Linux only)
  skip_dedup: false  # Skip deduplication if memory-constrained
  min_relevance_score: 0.5  # Minimum domain relevance to keep paper
  
  # Quality filters
  quality_filters:
    word_count_min: 100
    word_count_max: 5000
    alphanumeric_ratio_min: 0.4
    language: "en"  # Keep English only
  
  # Deduplication
  deduplication:
    similarity_threshold: 0.95  # MinHash similarity threshold
    use_gpu: false  # Use GPU for MinHash (if available)

# Step 4: Healthcare-Specific Processing
processing:
  num_workers: 4
  preserve_sections: true  # Extract section boundaries
  preserve_abbreviations: true  # Preserve scientific abbreviations
  max_chars: 12000

# Step 5: Tokenizer Training
tokenizer:
  vocab_size: 50000
  model_prefix: "healthcare_tokenizer"
  character_coverage: 0.9995
  model_type: "bpe"
  special_tokens:
    - "[DISEASE]"
    - "[PROTEIN]"
    - "[DRUG]"
    - "[GENE]"
  normalization_rule_name: "identity"  # Preserve case

# Step 6: Model Training
training:
  # Model configuration
  model_path: null  # Path to pretrained model (optional)
  vocab_size: 50000
  embedding_dim: 768
  num_shared_experts: 2
  num_routed_experts: 8
  top_k: 2
  
  # Training hyperparameters
  batch_size: 6
  gradient_accumulation_steps: 4
  max_steps: 50000
  learning_rate: 5e-4
  warmup_steps: 2000
  weight_decay: 1e-5
  max_grad_norm: 1.0
  
  # Dataset configuration
  max_length: 512
  min_length: 64
  shuffle_buffer: 100
  num_workers: 4
  pin_memory: true
  
  # Domain-aware loss weighting
  domain_weights:
    neurodegeneration: 1.5
    neuroscience: 1.2
    medical_imaging: 1.0
    clinical: 1.0
    drug_discovery: 1.0
    general_ml_health: 1.0
  
  # Checkpointing
  checkpoint_dir: "./checkpoints"
  checkpoint_interval: 5000  # Steps between checkpoints
  keep_last_n_checkpoints: 2
  
  # Logging
  log_interval: 100  # Steps between log entries
  log_file: "./training_log.csv"

# Step 7: Evaluation
evaluation:
  test_split: 0.1  # Fraction of data for testing
  batch_size: 16
  output_dir: "./evaluations"
  compute_perplexity: true
  compute_domain_accuracy: true
  compute_mrr: true
  compute_section_accuracy: true
  mrr_k: 20  # MRR@K

# Step 8: Inference Export
inference:
  output_dir: "./inference"
  quantize_int8: false  # INT8 quantization
  export_onnx: false  # Export to ONNX
  precompute_embeddings: true  # Precompute corpus embeddings
  embedding_cache_size: 10000  # LRU cache size

